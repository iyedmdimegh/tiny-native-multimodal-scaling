# Tiny end-to-end check. Must finish in under 3 minutes on CPU.
sizes: [S1, S2]
budgets: [200000]          # D, non-pad input tokens per run
lr: {S1: 1.0e-3, S2: 1.0e-3}
batch_size: 32
shares: {image: 0.3333, audio: 0.3333, text: 0.3334}
seed: 0
eval_examples: 64          # held-out examples per domain
log_every: 10
device: cpu
