# The real experiments.
sizes: [S1, S2, S3, S4, S5]
budgets: [5000000, 10000000, 20000000, 40000000, 80000000]
lr: sweep                  # best LR per size, read from results/lr_sweep.csv
lr_sweep:
  tokens: 10000000
  lrs: [3.0e-4, 6.0e-4, 1.2e-3, 2.4e-3, 4.8e-3]
batch_size: 32             # fixed for every run, not scaled with N or D
shares: {image: 0.3333, audio: 0.3333, text: 0.3334}
seed: 0
noise_seeds: [1, 2]        # extra seeds for the noise cells below
noise_cells: [[S2, 10000000], [S3, 20000000], [S4, 40000000]]
lr_check:                  # rerun these sizes at this budget with the two neighbouring LRs
  tokens: 80000000
  sizes: [S1, S5]
eval_examples: 2000        # held-out examples per domain
log_every: 50
device: auto
